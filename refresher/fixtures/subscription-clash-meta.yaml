# Shape of what the subscription host returns for flag=clash.meta with a
# clash.meta/1.0 User-Agent: a full Clash document, proxies named in Chinese with a
# traffic multiplier. Trimmed to the fields the refresher looks at, with the servers
# and credentials replaced.
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
proxies:
  - name: 台湾01-×1-客户端
    type: trojan
    server: tw01.example.invalid
    port: 443
    password: REDACTED
    sni: tw01.example.invalid
    skip-cert-verify: false
    udp: true
  - name: 台湾02-×2-客户端
    type: vmess
    server: tw02.example.invalid
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    alterId: 0
    cipher: auto
    tls: true
    network: ws
    ws-opts:
      path: /w
  - name: 臺灣03-×1-客户端
    type: ss
    server: tw03.example.invalid
    port: 8443
    cipher: aes-256-gcm
    password: REDACTED
    udp: true
  - name: 香港01-×1-客户端
    type: trojan
    server: hk01.example.invalid
    port: 443
    password: REDACTED
    udp: true
  - name: 日本01-×1-客户端
    type: trojan
    server: jp01.example.invalid
    port: 443
    password: REDACTED
    udp: true
  - name: 美国01-×3-客户端
    type: trojan
    server: us01.example.invalid
    port: 443
    password: REDACTED
    udp: true
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - 台湾01-×1-客户端
      - 香港01-×1-客户端
rules:
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
