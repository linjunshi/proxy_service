[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; Control channel for recover-app and operators
; (docker exec <container> supervisorctl -c /etc/supervisor/conf.d/wmsxwd.conf status).
[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

; VNC_SECURITY_ARGS is start-wmsxwd's verdict on the password secret:
; "-SecurityTypes VncAuth -PasswordFile /tmp/wmsxwd/vnc.pass" when the file
; holds a password, "-SecurityTypes None" when it is empty. supervisord
; expands it before splitting the command, so both tokens survive.
[program:virtual-display]
command=/usr/bin/Xtigervnc :1 -desktop wmsxwd -geometry 1280x800 -depth 24 -rfbport 5901 -localhost yes %(ENV_VNC_SECURITY_ARGS)s -AlwaysShared=1 -AcceptCutText=0 -SendCutText=0 -nolisten tcp
autostart=true
autorestart=true
priority=10
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop]
command=/usr/local/bin/wait-for-display /usr/bin/xfce4-session
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:keyring]
command=/usr/local/bin/wait-for-display /usr/bin/gnome-keyring-daemon --foreground --components=secrets
autostart=true
autorestart=true
priority=25
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc --heartbeat=30 0.0.0.0:%(ENV_WMSXWD_GUI_PORT)s 127.0.0.1:5901
autostart=true
autorestart=true
priority=30
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:wmsxwd]
command=/usr/local/bin/wait-for-display /opt/wmsxwd/wmsxwd
directory=/home/app
autostart=true
autorestart=unexpected
exitcodes=0
priority=40
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Long-running tunnel watchdog. A clean exit means "disabled via
; WMSXWD_AUTO_CONNECT" and must stay exited; a crash must come back.
[program:auto-connect]
command=/usr/local/bin/wait-for-display /usr/local/bin/auto-connect
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=0
priority=50
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
